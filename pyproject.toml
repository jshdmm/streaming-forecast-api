[project]
name = "forecast-api"
version = "0.1.0"
requires-python = ">=3.12"  # datetime.UTC gibt es erst ab 3.11, gebaut und getestet wird mit 3.12

[tool.ruff]
line-length = 100
target-version = "py312"  # damit ruff weiß, welche Sprachfeatures erlaubt sind

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
